[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gamescope-agent"
version = "0.1.0"
description = "A stateful, evidence-first RAG agent for video-game research with controlled web fallback."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jakob Dorn" }]
keywords = ["rag", "agents", "chromadb", "openai", "tavily", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "chromadb>=1.1,<2",
  "openai>=1.100,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "tavily-python>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
gamescope = "gamescope_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
